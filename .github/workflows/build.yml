name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # 러너의 기본 toolchain 은 Command Line Tools 라 swift-format 이 없다
      # ("unable to invoke subcommand: swift-format"). 개발에서 쓰는 Xcode 의
      # 서식 엔진과 같은 것을 고른다.
      - name: Select Xcode toolchain
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          swift format --version

      # 로컬 훅(scripts/git-hooks/pre-commit)과 같은 검사. 훅은 --no-verify 로
      # 우회할 수 있으므로 여기가 실제 게이트다.
      - name: Format check
        run: swift format lint -r -p --strict Sources

      # debug 빌드는 이 부류를 경고로 넘기고 release 에서만 에러로落と는다.
      # 그래서 CI 는 항상 release + warnings-as-errors 로 게이트를 선다.
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Package app bundle
        run: ./package-app.sh

      # CI Mac 은 가상머신인 경우가 많아 SMC / Energy Model 이 없을 수 있다.
      # 그래서 센서 조회는 참고 정보로만 남기고 게이트로 쓰지 않는다.
      - name: Sensor probe (informational)
        continue-on-error: true
        run: ./.build/release/syswatt --channels

      - uses: actions/upload-artifact@v4
        with:
          name: SysWatt
          path: SysWatt.app
          if-no-files-found: error
