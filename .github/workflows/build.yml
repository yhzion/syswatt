name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # debug 빌드는 이 부류를 경고로 넘기고 release 에서만 에러로落と는다.
      # 그래서 CI 는 항상 release + warnings-as-errors 로 게이트를 선다.
      - name: Build
        run: swift build -c release -Xswiftc -warnings-as-errors

      - name: Package app bundle
        run: ./package-app.sh

      # CI Mac 은 가상머신인 경우가 많아 SMC / Energy Model 이 없을 수 있다.
      # 그래서 센서 조회는 참고 정보로만 남기고 게이트로 쓰지 않는다.
      - name: Sensor probe (informational)
        continue-on-error: true
        run: ./.build/release/syswatt --channels

      - uses: actions/upload-artifact@v4
        with:
          name: SysWatt
          path: SysWatt.app
          if-no-files-found: error
